<!doctype html>
<html><head><meta charset="utf-8"><title>Price Lens bench</title></head>
<body>
<script type="module">
/* Runs the app's own reading code on one picture at a time, for bench/run.mjs. Nothing here is
   part of the app.
   ?engine=tesseract reads with src/ocr.js; ?engine=paddle with src/ocr-paddle.js, which reads in
   the same worker the app uses (src/paddle-worker.js); ?engine=app with src/reader.js, which picks
   between them as the app does. &settings={"detSide":480} changes PaddleOCR's settings. */
import { findPrices } from '../src/prices.js';

const ENGINES = { tesseract: '../src/ocr.js', paddle: '../src/ocr-paddle.js', app: '../src/reader.js' };
const params = new URLSearchParams(location.search);
const engine = params.get('engine') || 'tesseract';
const { readLines, getReader, configure, readerInfo, readerTiming } = await import(ENGINES[engine]);
if (params.get('settings')) configure?.(JSON.parse(params.get('settings')));

const load = (url) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error('could not load ' + url.slice(0, 80)));
  img.src = url;
});

/* camera shake, sensor noise and JPEG compression: the damage CSS cannot draw */
async function degrade(dataUrl, cam) {
  const img = await load(dataUrl);
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  if (cam.motion) {
    const steps = Math.max(2, Math.round(cam.motion));
    ctx.globalAlpha = 1 / steps;
    for (let i = 0; i < steps; i++) ctx.drawImage(img, i - steps / 2, (i - steps / 2) * 0.3);
    ctx.globalAlpha = 1;
  } else {
    ctx.drawImage(img, 0, 0);
  }
  if (cam.noise) {
    const d = ctx.getImageData(0, 0, c.width, c.height);
    let seed = 12345;
    const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (let i = 0; i < d.data.length; i += 4) {
      const n = (rand() + rand() + rand() - 1.5) * cam.noise * 1.4;
      d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n;
    }
    ctx.putImageData(d, 0, 0);
  }
  return c.toDataURL('image/jpeg', cam.jpeg || 0.85);
}

/* read one picture: aim is [x0, y0, x1, y1] in its pixels, or the whole picture */
async function read(url, { aim = null, local = null } = {}) {
  const img = await load(url);
  const region = aim
    ? { x: Math.max(0, Math.round(aim[0])), y: Math.max(0, Math.round(aim[1])), w: Math.round(Math.min(img.width, aim[2]) - Math.max(0, aim[0])), h: Math.round(Math.min(img.height, aim[3]) - Math.max(0, aim[1])) }
    : { x: 0, y: 0, w: img.width, h: img.height };
  const t0 = performance.now();
  const lines = await readLines(img, region);
  const center = { x: region.x + region.w / 2, y: region.y + region.h / 2, reach: Math.hypot(region.w, region.h) / 2 };
  const prices = findPrices(lines, { local, center });
  return {
    ms: Math.round(performance.now() - t0),
    lines: lines.map((l) => ({ text: l.text, height: Math.round(l.height), confidence: Math.round(l.confidence ?? -1) })),
    prices: prices.map((p) => ({ amount: p.amount, currency: p.currency, explicit: p.explicit, text: p.text, score: Math.round(p.score * 100) / 100 })),
  };
}

const t0 = performance.now();
window.bench = {
  engine, degrade, read,
  /* resolves with how long the reader took to start, and which reader that is */
  ready: getReader().then(() => ({ ms: Math.round(performance.now() - t0), reader: readerInfo ? readerInfo().engine : engine, parts: readerTiming?.() })),
};
</script>
</body></html>
